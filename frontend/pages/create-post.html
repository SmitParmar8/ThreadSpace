<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThreadSpace – New Post</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="form-card" style="max-width:640px">
      <h2 class="form-title">Create a Post</h2>

      <form id="createPostForm">
        <div class="form-group">
          <label for="title">Title <span style="color:var(--text-muted);font-size:11px">(max 100 chars)</span></label>
          <input type="text" id="title" placeholder="What's on your mind?" maxlength="100" required />
          <span id="titleCount" style="color:var(--text-muted);font-size:11px;display:block;text-align:right;margin-top:2px">0 / 100</span>
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" placeholder="Share your thoughts, questions, or experiences..." style="min-height:180px" required></textarea>
        </div>
        <div class="form-group">
          <label for="tag">Tag</label>
          <select id="tag" required>
            <option value="">Loading tags...</option>
          </select>
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <button type="submit" class="btn btn-primary form-submit">Publish Post</button>
      </form>
    </div>
  </div>

  <script src="../dist/api.js"></script>
  <script src="../dist/create-post.js"></script>
</body>
</html>
