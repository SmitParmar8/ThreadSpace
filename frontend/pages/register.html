<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThreadSpace – Register</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="form-card">
      <h2 class="form-title">&lt;ThreadSpace&gt;</h2>
      <p style="text-align:center;color:var(--text-muted);margin-bottom:24px;font-size:13px">Create your developer account</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="johndoe" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required />
        </div>
        <div class="form-group">
          <label for="userLevel">Developer Level</label>
          <select id="userLevel">
            <option value="Student">Student</option>
            <option value="Fresher">Fresher</option>
            <option value="Mid-Level">Mid-Level</option>
            <option value="Pro">Pro</option>
          </select>
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        <button type="submit" class="btn btn-primary form-submit">Create Account</button>
      </form>

      <p class="form-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="../dist/api.js"></script>
  <script src="../dist/register.js"></script>
</body>
</html>
